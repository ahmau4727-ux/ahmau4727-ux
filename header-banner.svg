  <text x="700" y="215" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="88" font-weight="900" letter-spacing="24" fill="url(#htext)" filter="url(#hglow)">AHMED</text>
  <text x="700" y="258" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="20" letter-spacing="10" fill="#FFD700" opacity="0.9">AI SECURITY RESEARCH &#183; PROMPT INJECTION</text>
