<svg width="1400" height="280" viewBox="0 0 1400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hgold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5A00"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFDF00"/>
      <stop offset="75%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B5A00"/>
    </linearGradient>
    <linearGradient id="hfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="htext" x1="0" y1="0" x2="0" y2="1">
